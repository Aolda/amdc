              pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
            databaseName:
              type: string
              minLength: 1
              maxLength: 256
              description: Exact database label value for this metric.
              pattern: ^[^\x00-\x1f\x7f]+$
            start:
              type: string
              description: UTC RFC3339 timestamp, e.g. 2026-09-17T01:00:00Z.
              pattern: ^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d{1,3})?Z$
            end:
              type: string
              description: UTC RFC3339 timestamp, e.g. 2026-09-17T01:00:00Z.
              pattern: ^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d{1,3})?Z$
          required:
