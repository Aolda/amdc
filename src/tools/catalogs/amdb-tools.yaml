plugins:
  - name: system
    description: Service-wide health and monitoring target status tools.
    domainHints:
      - system
      - health
      - target
      - exporter
      - unhealthy
      - 장애
      - 헬스
      - 전체
    tools:
      - name: system_check_configured_http_health
        description: Check a server-configured HTTP health endpoint and summarize basic availability.
        access:
          level: 0
          readOnly: true
        source: http_health
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: system_check_configured_http_health
      - name: system_check_backend_health
        description: Read the AMDB Backend /health result and summarize service dependency health.
        access:
          level: 0
          readOnly: true
        source: amdb_backend
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: system_check_backend_health

  - name: prometheus
    description: Tools that read Prometheus collection target and metric metadata.
    domainHints:
      - prometheus
      - target
      - scrape
      - exporter
      - metric
      - 수집
      - 타깃
      - 메트릭
    tools:
      - name: prometheus_get_targets
        description: Read active Prometheus targets, target labels, health, last scrape time, scrape duration, and last scrape error.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/targets
          query:
            state: active

  - name: mysql
    description: Tools that read MySQL server metrics and AMDB database inventory.
    domainHints:
      - db
      - database
      - mysql
      - quota
      - user
      - schema
      - 데이터베이스
      - 사용자
      - 용량
      - 할당량
    tools:
      - name: mysql_get_service_status
        description: Read the MySQL availability value, version information, and uptime from Prometheus.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/query
          query:
            query: '{__name__=~"mysql_up|mysql_version_info|mysql_global_status_uptime"}'
      - name: mysql_get_connections
        description: Read current, running, cumulative, failed, maximum-used, and configured-maximum MySQL connection metrics from Prometheus.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/query
          query:
            query: '{__name__=~"mysql_global_status_threads_connected|mysql_global_status_threads_running|mysql_global_status_connections|mysql_global_status_aborted_clients|mysql_global_status_aborted_connects|mysql_global_status_max_used_connections|mysql_global_variables_max_connections"}'
      - name: mysql_get_query_activity
        description: Read raw MySQL slow-query counts and AMDB per-user query duration metrics from Prometheus.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/query
          query:
            query: '{__name__=~"mysql_global_status_slow_queries|amdb_user_slow_queries|amdb_user_queries_total|amdb_user_avg_query_time_us|amdb_user_max_query_time_us|amdb_user_total_query_time_us"}'
      - name: db_list_databases
        description: Read AMDB metadata for all databases, owners, status, quota, connection limits, and query digest logging flags.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: db_list_databases
      - name: db_get_database_detail
        description: Read AMDB metadata detail for one database, including owner, status, quota, max connections, and query digest logging flag.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            databaseId:
              type: string
              minLength: 1
              maxLength: 128
          required: [databaseId]
        execution:
          type: source_adapter
          operation: db_get_database_detail
      - name: db_list_users
        description: Read AMDB user inventory with user status, quota, and database count.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: db_list_users

  - name: backend
    description: Tools that read AMDB FastAPI Backend health and source data.
    domainHints:
      - backend
      - api
      - dependency
      - fastapi
      - amdb
      - 5xx
      - 접속
      - 백엔드
    tools:
      - name: backend_get_health
        description: Read the server-configured AMDB Backend health endpoint and return its HTTP status, content type, and response body.
        access:
          level: 0
          readOnly: true
        source: amdb_backend
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: local_shell
          command: |
            curl --silent --show-error --include --request GET {{ env.backend_health_url }}
          environment:
            backend_health_url:
              dev: AMDC_DEV_HEALTHCHECK_URL
              prod: AMDC_PROD_HEALTHCHECK_URL
