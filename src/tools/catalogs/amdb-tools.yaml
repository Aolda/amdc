plugins:
  - name: system
    description: Service-wide health and monitoring target status tools.
    domainHints:
      - system
      - health
      - target
      - exporter
      - unhealthy
      - 장애
      - 헬스
      - 전체
    tools:
      - name: system_check_configured_http_health
        description: Check a server-configured HTTP health endpoint and summarize basic availability.
        access:
          level: 0
          readOnly: true
        source: http_health
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: system_check_configured_http_health
      - name: system_check_backend_health
        description: Read the AMDB Backend /health result and summarize service dependency health.
        access:
          level: 0
          readOnly: true
        source: amdb_backend
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: system_check_backend_health
      - name: system_check_prometheus_targets
        description: Check Prometheus target availability for MySQL, ProxySQL, node exporter, and AMDB custom exporter.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: system_check_prometheus_targets

  - name: logs
    description: Loki-based log search and log pattern summarization tools.
    domainHints:
      - log
      - logs
      - error
      - timeout
      - exception
      - 인증
      - 오류
      - 로그
      - 접속
    tools:
      - name: logs_search_service_errors
        description: Search recent logs for a selected service and summarize repeated warning or error patterns.
        access:
          level: 0
          readOnly: true
        source: loki
        allowedEnvironments: [dev, prod]
        timeoutMs: 10000
        input:
          type: object
          additionalProperties: false
          properties:
            service:
              type: string
              enum: [backend, celery-worker, celery-beat, custom-exporter, mysql, metadata-mysql, proxysql, redis]
              description: Docker compose service label to search.
            windowMinutes:
              type: number
              enum: [5, 10, 30]
            maxPatterns:
              type: number
              minimum: 1
              maximum: 10
          required: [service, windowMinutes, maxPatterns]
        execution:
          type: source_adapter
          operation: logs_search_service_errors
      - name: logs_search_query_digest
        description: Search custom-exporter query digest logs for a database user and summarize slow or heavy query patterns.
        access:
          level: 0
          readOnly: true
        source: loki
        allowedEnvironments: [dev, prod]
        timeoutMs: 10000
        input:
          type: object
          additionalProperties: false
          properties:
            mysqlDbName:
              type: string
              minLength: 1
              maxLength: 128
              description: AMDB MySQL database/user name.
            windowMinutes:
              type: number
              enum: [10, 30, 60]
            search:
              type: string
              maxLength: 100
              description: Optional digest text filter.
          required: [mysqlDbName, windowMinutes]
        execution:
          type: source_adapter
          operation: logs_search_query_digest

  - name: metrics
    description: Prometheus-based service, database, user, and container metric tools.
    domainHints:
      - metric
      - metrics
      - prometheus
      - 5xx
      - latency
      - connection
      - memory
      - cpu
      - qps
      - query
      - 지표
      - 증가
      - 느림
      - 연결
      - 메모리
    tools:
      - name: metrics_get_database_overview
        description: Read database size, query count, and connection overview metrics for all AMDB databases.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: metrics_get_database_overview
      - name: metrics_get_database_instant
        description: Read current database size, table count, connection count, query count, slow query count, and average query time for one AMDB database.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            mysqlDbName:
              type: string
              minLength: 1
              maxLength: 128
          required: [mysqlDbName]
        execution:
          type: source_adapter
          operation: metrics_get_database_instant
      - name: metrics_get_database_range
        description: Read time series for database size, connections, query rate, slow queries, and average query time for one AMDB database.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 10000
        input:
          type: object
          additionalProperties: false
          properties:
            mysqlDbName:
              type: string
              minLength: 1
              maxLength: 128
            windowMinutes:
              type: number
              enum: [10, 30, 60]
          required: [mysqlDbName, windowMinutes]
        execution:
          type: source_adapter
          operation: metrics_get_database_range
      - name: metrics_get_user_connection_usage
        description: Read ProxySQL and MySQL current connection usage for one AMDB database user.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            username:
              type: string
              minLength: 1
              maxLength: 128
          required: [username]
        execution:
          type: source_adapter
          operation: metrics_get_user_connection_usage
      - name: metrics_get_mysql_global_status
        description: Read MySQL server global status metrics such as uptime, connected threads, running threads, slow queries, and aborted connects.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: metrics_get_mysql_global_status
      - name: metrics_get_container_resources
        description: Read cAdvisor CPU, memory, network, filesystem, and OOM metrics for AMDB containers.
        access:
          level: 0
          readOnly: true
        source: cadvisor
        allowedEnvironments: [dev, prod]
        timeoutMs: 10000
        input:
          type: object
          additionalProperties: false
          properties:
            service:
              type: string
              enum: [backend, celery-worker, celery-beat, custom-exporter, mysql, metadata-mysql, proxysql, redis]
            windowMinutes:
              type: number
              enum: [10, 30, 60]
          required: [service, windowMinutes]
        execution:
          type: source_adapter
          operation: metrics_get_container_resources

  - name: proxy
    description: ProxySQL read-only status, routing, and connection pool tools.
    domainHints:
      - proxy
      - proxysql
      - routing
      - pool
      - hostgroup
      - connection
      - 접속
      - 라우팅
      - 프록시
    tools:
      - name: proxy_list_query_rules
        description: Read active ProxySQL runtime query rules from the AMDB admin API.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: proxy_list_query_rules
      - name: proxy_check_connection_pool
        description: Read ProxySQL connection pool connection, latency, and backend status metrics.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: proxy_check_connection_pool
      - name: proxy_check_access_denials
        description: Read ProxySQL access denial counters for password failures, max connection rejections, and SQL injection detection.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            windowMinutes:
              type: number
              enum: [10, 30, 60]
          required: [windowMinutes]
        execution:
          type: source_adapter
          operation: proxy_check_access_denials

  - name: db
    description: AMDB metadata and database inventory read-only tools.
    domainHints:
      - db
      - database
      - mysql
      - quota
      - user
      - schema
      - 데이터베이스
      - 사용자
      - 용량
      - 할당량
    tools:
      - name: db_list_databases
        description: Read AMDB metadata for all databases, owners, status, quota, connection limits, and query digest logging flags.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: db_list_databases
      - name: db_get_database_detail
        description: Read AMDB metadata detail for one database, including owner, status, quota, max connections, and query digest logging flag.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            databaseId:
              type: string
              minLength: 1
              maxLength: 128
          required: [databaseId]
        execution:
          type: source_adapter
          operation: db_get_database_detail
      - name: db_list_users
        description: Read AMDB user inventory with user status, quota, and database count.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: db_list_users

  - name: backup
    description: Backup and restore state inspection tools.
    domainHints:
      - backup
      - restore
      - snapshot
      - replica
      - garage
      - 백업
      - 복구
      - 스냅샷
    tools:
      - name: backup_get_overview
        description: Read backup coverage summary, per-database backup state, and backup user hotspots.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: backup_get_overview
      - name: backup_list_jobs
        description: Read backup job list and status, optionally filtered by database id.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            databaseId:
              type: string
              minLength: 1
              maxLength: 128
          required: []
        execution:
          type: source_adapter
          operation: backup_list_jobs
      - name: backup_get_schedule
        description: Read configured backup schedule state.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: backup_get_schedule
      - name: backup_list_restore_jobs
        description: Read restore job list and status, optionally filtered by database id.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            databaseId:
              type: string
              minLength: 1
              maxLength: 128
          required: []
        execution:
          type: source_adapter
          operation: backup_list_restore_jobs

  - name: backend
    description: AMDB Backend API and dependency status tools.
    domainHints:
      - backend
      - api
      - dependency
      - fastapi
      - amdb
      - 5xx
      - 접속
      - 백엔드
    tools:
      - name: backend_check_api_health
        description: Check AMDB Backend API health and dependency status using its read-only health endpoint.
        access:
          level: 0
          readOnly: true
        source: amdb_backend
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: backend_check_api_health
