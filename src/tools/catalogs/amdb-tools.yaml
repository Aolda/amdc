  - name: proxysql
    description: Read ProxySQL frontend sessions, backend connection pools, user
      connection counts, query digests, errors and runtime counters.
    domainHints:
      - proxysql
      - proxy
      - pool
      - routing
      - digest
      - 프록시
      - 연결풀
    tools:
      - name: proxysql_get_connection_pool
        description: Read backend connection pool status, used/free connections,
          connection counters, query count, byte counters and latency in
          microseconds.
        access:
          level: 0
          readOnly: true
        source: proxysql
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            limit: &a1
              type: integer
              minimum: 1
              maximum: 200
              description: Maximum returned rows; default 100. Additional rows set truncated.
        execution:
          type: proxysql_sql
          sql: SELECT hostgroup, srv_host, srv_port, status, ConnUsed, ConnFree, ConnOK,
            ConnERR, MaxConnUsed, Queries, Bytes_data_sent, Bytes_data_recv,
            Latency_us FROM stats_mysql_connection_pool
          orderBy: hostgroup, srv_host, srv_port
          filters: []
          defaults:
            limit: 100
          requires: {}
          environmentPrefix:
            dev: AMDC_DEV_PROXYSQL_
            prod: AMDC_PROD_PROXYSQL_
      - name: proxysql_get_connection_pool_by_hostgroup
        description: Read backend pool rows for one hostgroup, including status,
          connection counters and latency in microseconds.
        access:
          level: 0
          readOnly: true
        source: proxysql
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            hostgroup:
              type: integer
              minimum: 0
              maximum: 2147483647
              description: Observed ProxySQL hostgroup number.
            limit: *a1
          required:
            - hostgroup
        execution:
          type: proxysql_sql
          sql: SELECT hostgroup, srv_host, srv_port, status, ConnUsed, ConnFree, ConnOK,
            ConnERR, MaxConnUsed, Queries, Bytes_data_sent, Bytes_data_recv,
            Latency_us FROM stats_mysql_connection_pool
          orderBy: srv_host, srv_port
          filters:
            - input: hostgroup
              sql: hostgroup = ?
              bindings:
                - hostgroup
          defaults:
            limit: 100
          requires: {}
          environmentPrefix:
            dev: AMDC_DEV_PROXYSQL_
            prod: AMDC_PROD_PROXYSQL_
