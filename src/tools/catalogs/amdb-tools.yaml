plugins:
  - name: system
    description: Tools that read service health endpoints.
    domainHints: [system, health, backend, api, 헬스, 백엔드]
    tools:
      - name: backend_get_health
        description: Read the configured AMDB Backend health endpoint as raw HTTP headers and body, with command exit code and stderr.
        access:
          level: 0
          readOnly: true
        source: amdb_backend
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: local_shell
          command: |
            curl --disable --globoff --proto =http,https --proto-redir =http,https --max-redirs 0 --silent --show-error --include --request GET {{ env.backend_health_url }}
          environment:
            backend_health_url:
              dev: AMDC_DEV_HEALTHCHECK_URL
              prod: AMDC_PROD_HEALTHCHECK_URL
  - name: prometheus
    description: Tools that read Prometheus scrape targets, metric metadata, label sets, and metric samples.
    domainHints:
      - prometheus
      - target
      - scrape
      - exporter
      - metric
      - 수집
      - 타깃
      - 메트릭
    tools:
      - name: prometheus_get_targets
        description: Read active Prometheus targets, target labels, health, last scrape time, scrape duration, and
          last scrape error.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/targets
          query:
            state: active
      - name: prometheus_list_metric_names
        description: Read metric names stored in Prometheus, including names whose series may no longer be active.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/label/__name__/values
          query: {}
      - name: prometheus_get_metric_metadata
        description: Read the declared type, help text and unit for one metric name.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            metricName:
              type: string
              minLength: 1
              maxLength: 128
              description: Exact metric name from the metric names list.
              pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
          required:
            - metricName
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/metadata
          query: {}
          selection: metadata
      - name: prometheus_get_metric_series
        description: Read all label sets for one metric within a UTC interval of at most 24 hours. Metadata does not
          prove samples exist throughout the interval.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            metricName:
              type: string
              minLength: 1
              maxLength: 128
              description: Exact metric name from the metric names list.
              pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
            start:
              type: string
              description: UTC RFC3339 timestamp, e.g. 2026-09-17T01:00:00Z.
              pattern: ^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d{1,3})?Z$
            end:
              type: string
              description: UTC RFC3339 timestamp, e.g. 2026-09-17T01:00:00Z.
              pattern: ^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d{1,3})?Z$
          required:
            - metricName
            - start
            - end
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/series
          query: {}
          selection: series
      - name: prometheus_get_metric_value
        description: Read all series of one metric at an evaluation time. Returns original labels, timestamps and values.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            metricName:
              type: string
              minLength: 1
              maxLength: 128
              description: Exact metric name from the metric names list.
              pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
            time:
              type: string
              description: UTC RFC3339 timestamp, e.g. 2026-09-17T01:00:00Z.
              pattern: ^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d{1,3})?Z$
          required:
            - metricName
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/query
          query: {}
          selection: instant
      - name: prometheus_get_metric_range
        description: Read one metric evaluated at fixed steps within a UTC interval of at most 24 hours. Returns
          original values without rate or ratio calculations; timestamps are evaluation times.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            metricName:
              type: string
              minLength: 1
              maxLength: 128
              description: Exact metric name from the metric names list.
              pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
            start:
              type: string
              description: UTC RFC3339 timestamp, e.g. 2026-09-17T01:00:00Z.
              pattern: ^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d{1,3})?Z$
            end:
              type: string
              description: UTC RFC3339 timestamp, e.g. 2026-09-17T01:00:00Z.
              pattern: ^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d{1,3})?Z$
            stepSeconds:
              type: integer
              minimum: 15
              maximum: 3600
              description: Evaluation step in seconds; default 60. Maximum 1441 points per series.
          required:
            - metricName
            - start
            - end
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/query_range
