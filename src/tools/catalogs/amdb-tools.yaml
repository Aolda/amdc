plugins:
  - name: system
    description: Service-wide health and monitoring target status tools.
    domainHints:
      - system
      - health
      - target
      - exporter
      - unhealthy
      - 장애
      - 헬스
      - 전체
    tools:
      - name: system_check_configured_http_health
        description: Check a server-configured HTTP health endpoint and summarize basic availability.
        access:
          level: 0
          readOnly: true
        source: http_health
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: system_check_configured_http_health
      - name: system_check_backend_health
        description: Read the AMDB Backend /health result and summarize service dependency health.
        access:
          level: 0
          readOnly: true
        source: amdb_backend
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: system_check_backend_health

  - name: prometheus
    description: Tools that read Prometheus collection target and metric metadata.
    domainHints:
      - prometheus
      - target
      - scrape
      - exporter
      - metric
      - 수집
      - 타깃
      - 메트릭
    tools:
      - name: prometheus_get_targets
        description: Read active Prometheus targets, target labels, health, last scrape time, scrape duration, and last scrape error.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/targets
          query:
            state: active

  - name: mysql
    description: Tools that read MySQL schemas, connections, transactions, data-lock waits, server metrics, and AMDB database inventory.
    domainHints:
      - db
      - database
      - mysql
      - quota
      - user
      - schema
      - 데이터베이스
      - 사용자
      - 용량
      - 할당량
    tools:
      - name: mysql_list_schemas
        description: Read non-system MySQL schema names, default character sets and collations.
        access:
          level: 0
          readOnly: true
        source: mysql
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            namePrefix:
              type: string
              description: Optional literal schema name prefix; no wildcard expansion. Omit for all visible non-system schemas.
              minLength: 1
              maxLength: 128
            limit:
              type: integer
              minimum: 1
              maximum: 200
              description: Maximum rows, integer; default 100. Overflow is marked truncated.
        execution:
          type: mysql_sql
          sql: |-
            SELECT SCHEMA_NAME AS schemaName, DEFAULT_CHARACTER_SET_NAME AS characterSet,
                  DEFAULT_COLLATION_NAME AS collationName FROM information_schema.SCHEMATA WHERE SCHEMA_NAME NOT IN ('mysql','sys','information_schema','performance_schema')
          orderBy: SCHEMA_NAME
          filters:
            - input: namePrefix
              sql: LEFT(SCHEMA_NAME, CHAR_LENGTH(?)) = ?
              bindings:
                - namePrefix
                - namePrefix
          defaults:
            limit: 100
          requires: {}
          environmentPrefix:
            dev: AMDC_DEV_MYSQL_
            prod: AMDC_PROD_MYSQL_
      - name: mysql_get_processlist
        description: Read current MySQL foreground connections, default schema, command, state, state duration and SQL text (up to 4096 characters). Idle connections are excluded by default.
        access:
          level: 0
          readOnly: true
        source: mysql
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            schema:
              type: string
              description: Optional exact connection default schema, not all accessed schemas. Omit for no schema filter.
              minLength: 1
              maxLength: 128
            connectionId:
              type: string
              description: Exact MySQL backend connection ID as a decimal string; omission leaves connections unrestricted.
              minLength: 1
              maxLength: 20
              pattern: ^[0-9]{1,20}$
            includeIdle:
              type: boolean
              description: Include sleeping connections; default false.
            limit:
              type: integer
              minimum: 1
              maximum: 200
              description: Maximum rows, integer; default 100. Overflow is marked truncated.
        execution:
          type: mysql_sql
          sql: |-
            SELECT CAST(t.PROCESSLIST_ID AS CHAR) AS connectionId, CAST(t.THREAD_ID AS CHAR) AS threadId,
                  t.PROCESSLIST_USER AS mysqlUser, t.PROCESSLIST_HOST AS host,
                  t.PROCESSLIST_DB AS defaultSchema, t.PROCESSLIST_COMMAND AS command,
                  t.PROCESSLIST_STATE AS state, t.PROCESSLIST_TIME AS stateDurationSeconds,
                  LEFT(t.PROCESSLIST_INFO, 4096) AS currentStatement,
                  COALESCE(CHAR_LENGTH(t.PROCESSLIST_INFO) > 4096, 0) AS statementTruncated
                  FROM performance_schema.threads t WHERE t.TYPE = 'FOREGROUND' AND t.PROCESSLIST_ID <> CONNECTION_ID()
          orderBy: t.PROCESSLIST_TIME DESC, t.PROCESSLIST_ID
          filters:
            - input: schema
              sql: t.PROCESSLIST_DB = ?
              bindings:
                - schema
            - input: connectionId
              sql: t.PROCESSLIST_ID = ?
              bindings:
                - connectionId
            - input: includeIdle
              sql: t.PROCESSLIST_COMMAND <> 'Sleep'
              bindings: []
              when: false
          defaults:
            limit: 100
            includeIdle: false
          requires: {}
          environmentPrefix:
            dev: AMDC_DEV_MYSQL_
            prod: AMDC_PROD_MYSQL_
      - name: mysql_get_transactions
        description: Read active InnoDB transactions, connection IDs, start times, lock and modification counts and current SQL text (up to 4096 characters).
        access:
          level: 0
          readOnly: true
        source: mysql
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            connectionId:
              type: string
              description: Exact MySQL backend connection ID as a decimal string; omission leaves connections unrestricted.
              minLength: 1
              maxLength: 20
              pattern: ^[0-9]{1,20}$
            transactionId:
              type: string
              description: Exact InnoDB transaction ID as a decimal string; omission leaves transactions unrestricted.
              minLength: 1
              maxLength: 20
              pattern: ^[0-9]{1,20}$
            limit:
              type: integer
              minimum: 1
              maximum: 200
              description: Maximum rows, integer; default 100. Overflow is marked truncated.
        execution:
          type: mysql_sql
          sql: |-
            SELECT CAST(x.TRX_ID AS CHAR) AS transactionId, CAST(x.TRX_MYSQL_THREAD_ID AS CHAR) AS connectionId,
                  t.PROCESSLIST_USER AS mysqlUser, t.PROCESSLIST_DB AS defaultSchema,
                  x.TRX_STATE AS state, x.TRX_STARTED AS startedAt, x.TRX_WAIT_STARTED AS waitStartedAt,
                  x.TRX_ROWS_LOCKED AS rowsLocked, x.TRX_ROWS_MODIFIED AS rowsModified,
                  x.TRX_ISOLATION_LEVEL AS isolationLevel, LEFT(x.TRX_QUERY, 4096) AS currentStatement,
                  COALESCE(CHAR_LENGTH(x.TRX_QUERY) > 4096, 0) AS statementTruncated
                  FROM information_schema.INNODB_TRX x LEFT JOIN performance_schema.threads t
                  ON t.PROCESSLIST_ID = x.TRX_MYSQL_THREAD_ID WHERE x.TRX_MYSQL_THREAD_ID <> CONNECTION_ID()
          orderBy: x.TRX_STARTED, x.TRX_ID
          filters:
            - input: connectionId
              sql: x.TRX_MYSQL_THREAD_ID = ?
              bindings:
                - connectionId
            - input: transactionId
              sql: x.TRX_ID = ?
              bindings:
                - transactionId
          defaults:
            limit: 100
          requires: {}
          environmentPrefix:
            dev: AMDC_DEV_MYSQL_
            prod: AMDC_PROD_MYSQL_
      - name: mysql_get_all_lock_waits
        description: Read current InnoDB data-lock waiting and blocking connection/transaction pairs across all schemas and users without filters. Returns up to 100 wait edges with a truncation flag. Does not include metadata lock waits. Takes no arguments.
        access:
          level: 0
          readOnly: true
        source: mysql
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: mysql_sql
          sql: |-
            SELECT CAST(w.REQUESTING_ENGINE_TRANSACTION_ID AS CHAR) AS waitingTransactionId,
                  CAST(r.PROCESSLIST_ID AS CHAR) AS waitingConnectionId,
                  CAST(w.BLOCKING_ENGINE_TRANSACTION_ID AS CHAR) AS blockingTransactionId,
                  CAST(b.PROCESSLIST_ID AS CHAR) AS blockingConnectionId,
                  requested.OBJECT_SCHEMA AS objectSchema, requested.OBJECT_NAME AS objectName,
                  requested.INDEX_NAME AS indexName, requested.LOCK_MODE AS requestedLockMode,
                  held.LOCK_MODE AS blockingLockMode
                  FROM performance_schema.data_lock_waits w
                  JOIN performance_schema.data_locks requested ON requested.ENGINE = w.ENGINE
                    AND requested.ENGINE_LOCK_ID = w.REQUESTING_ENGINE_LOCK_ID
                  JOIN performance_schema.data_locks held ON held.ENGINE = w.ENGINE
                    AND held.ENGINE_LOCK_ID = w.BLOCKING_ENGINE_LOCK_ID
                  LEFT JOIN performance_schema.threads r ON r.THREAD_ID = w.REQUESTING_THREAD_ID
                  LEFT JOIN performance_schema.threads b ON b.THREAD_ID = w.BLOCKING_THREAD_ID
          orderBy: w.REQUESTING_ENGINE_LOCK_ID, w.BLOCKING_ENGINE_LOCK_ID
          filters: []
          defaults:
            limit: 100
          requires: {}
          environmentPrefix:
            dev: AMDC_DEV_MYSQL_
            prod: AMDC_PROD_MYSQL_
      - name: mysql_get_lock_waits
        description: Read InnoDB data-lock waiting and blocking connection/transaction pairs and locked objects. Does not include metadata lock waits.
        access:
          level: 0
          readOnly: true
        source: mysql
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            schema:
              type: string
              description: Optional exact locked object schema. Omit for no schema filter.
              minLength: 1
              maxLength: 128
            table:
              type: string
              description: Exact locked table name within schema; requires schema.
              minLength: 1
              maxLength: 128
            connectionId:
              type: string
              description: Exact MySQL backend connection ID on either side of the wait; omission leaves connections unrestricted.
              minLength: 1
              maxLength: 20
              pattern: ^[0-9]{1,20}$
            limit:
              type: integer
              minimum: 1
              maximum: 200
              description: Maximum rows, integer; default 100. Overflow is marked truncated.
        execution:
          type: mysql_sql
          sql: |-
            SELECT CAST(w.REQUESTING_ENGINE_TRANSACTION_ID AS CHAR) AS waitingTransactionId,
                  CAST(r.PROCESSLIST_ID AS CHAR) AS waitingConnectionId,
                  CAST(w.BLOCKING_ENGINE_TRANSACTION_ID AS CHAR) AS blockingTransactionId,
                  CAST(b.PROCESSLIST_ID AS CHAR) AS blockingConnectionId,
                  requested.OBJECT_SCHEMA AS objectSchema, requested.OBJECT_NAME AS objectName,
                  requested.INDEX_NAME AS indexName, requested.LOCK_MODE AS requestedLockMode,
                  held.LOCK_MODE AS blockingLockMode
                  FROM performance_schema.data_lock_waits w
                  JOIN performance_schema.data_locks requested ON requested.ENGINE = w.ENGINE
                    AND requested.ENGINE_LOCK_ID = w.REQUESTING_ENGINE_LOCK_ID
                  JOIN performance_schema.data_locks held ON held.ENGINE = w.ENGINE
                    AND held.ENGINE_LOCK_ID = w.BLOCKING_ENGINE_LOCK_ID
                  LEFT JOIN performance_schema.threads r ON r.THREAD_ID = w.REQUESTING_THREAD_ID
                  LEFT JOIN performance_schema.threads b ON b.THREAD_ID = w.BLOCKING_THREAD_ID
          orderBy: w.REQUESTING_ENGINE_LOCK_ID, w.BLOCKING_ENGINE_LOCK_ID
          filters:
            - input: schema
              sql: requested.OBJECT_SCHEMA = ?
              bindings:
                - schema
            - input: table
              sql: requested.OBJECT_NAME = ?
              bindings:
                - table
            - input: connectionId
              sql: (r.PROCESSLIST_ID = ? OR b.PROCESSLIST_ID = ?)
              bindings:
                - connectionId
                - connectionId
          defaults:
            limit: 100
          requires:
            table: schema
          environmentPrefix:
            dev: AMDC_DEV_MYSQL_
            prod: AMDC_PROD_MYSQL_
      - name: mysql_get_service_status
        description: Read the MySQL availability value, version information, and uptime from Prometheus.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/query
          query:
            query: '{__name__=~"mysql_up|mysql_version_info|mysql_global_status_uptime"}'
      - name: mysql_get_connections
        description: Read current, running, cumulative, failed, maximum-used, and configured-maximum MySQL connection metrics from Prometheus.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/query
          query:
            query: '{__name__=~"mysql_global_status_threads_connected|mysql_global_status_threads_running|mysql_global_status_connections|mysql_global_status_aborted_clients|mysql_global_status_aborted_connects|mysql_global_status_max_used_connections|mysql_global_variables_max_connections"}'
      - name: mysql_get_query_activity
        description: Read raw MySQL slow-query counts and AMDB per-user query duration metrics from Prometheus.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: prometheus_http
          baseUrlEnvironment:
            dev: AMDC_DEV_PROMETHEUS_URL
            prod: AMDC_PROD_PROMETHEUS_URL
          path: /api/v1/query
          query:
            query: '{__name__=~"mysql_global_status_slow_queries|amdb_user_slow_queries|amdb_user_queries_total|amdb_user_avg_query_time_us|amdb_user_max_query_time_us|amdb_user_total_query_time_us"}'
      - name: db_list_databases
        description: Read AMDB metadata for all databases, owners, status, quota, connection limits, and query digest logging flags.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: db_list_databases
      - name: db_get_database_detail
        description: Read AMDB metadata detail for one database, including owner, status, quota, max connections, and query digest logging flag.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties:
            databaseId:
              type: string
              minLength: 1
              maxLength: 128
          required:
            - databaseId
        execution:
          type: source_adapter
          operation: db_get_database_detail
      - name: db_list_users
        description: Read AMDB user inventory with user status, quota, and database count.
        access:
          level: 0
          readOnly: true
        source: amdb_admin_api
        allowedEnvironments:
          - dev
          - prod
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: source_adapter
          operation: db_list_users

  - name: backend
    description: Tools that read AMDB FastAPI Backend health and source data.
    domainHints:
      - backend
      - api
      - dependency
      - fastapi
      - amdb
      - 5xx
      - 접속
      - 백엔드
    tools:
      - name: backend_get_health
        description: Read the server-configured AMDB Backend health endpoint and return its HTTP status, content type, and response body.
        access:
          level: 0
          readOnly: true
        source: amdb_backend
        allowedEnvironments: [dev, prod]
        timeoutMs: 5000
        input:
          type: object
          additionalProperties: false
          properties: {}
        execution:
          type: local_shell
          command: |
            curl --silent --show-error --include --request GET {{ env.backend_health_url }}
          environment:
            backend_health_url:
              dev: AMDC_DEV_HEALTHCHECK_URL
              prod: AMDC_PROD_HEALTHCHECK_URL
