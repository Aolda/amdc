          additionalProperties: false
          properties:
            metricName:
              type: string
              minLength: 1
              maxLength: 128
              description: Exact metric name from the metric names list.
              pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
            instance:
              type: string
