          query: {}
          selection: series
          labelInputs:
            databaseName: database
      - name: prometheus_get_metric_value_by_instance
        description: Read raw metric samples at an evaluation time for one exact instance label value.
        access:
          level: 0
          readOnly: true
        source: prometheus
        allowedEnvironments:
